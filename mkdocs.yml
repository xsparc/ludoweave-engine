site_name: LudoWeave Engine
site_description: Deterministic, headless-first Python engine for agent-operable 2D worlds
repo_name: ludoweave-engine
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Home: index.md
  - Architecture: architecture.md
  - Runtime contract: runtime-contract.md
  - ECS and world storage: ecs.md
  - Fixed-step application: fixed-step-application.md
  - Persistent commands: commands.md
  - Headless command workflow: cli-workflows.md
  - Benchmarks: benchmarks.md
  - Decisions:
      - ADR index: adr/index.md
      - ADR-0001 — Product scope: adr/0001-deterministic-headless-agent-operable-2d.md
      - ADR-0002 — Dependency direction: adr/0002-dependency-direction-and-backend-isolation.md
      - ADR-0003 — Component identity: adr/0003-component-identity-and-migrations.md
      - ADR-0004 — World storage: adr/0004-canonical-world-storage-and-epochs.md
      - ADR-0005 — Queries and local commands: adr/0005-query-cursors-and-local-command-buffers.md
      - ADR-0006 — Resources and scheduling: adr/0006-explicit-resources-and-conflict-aware-serial-scheduling.md
      - ADR-0007 — Fixed-step application: adr/0007-fixed-step-application-input-and-system-context.md
      - ADR-0008 - Command protocol: adr/0008-versioned-command-envelope-and-canonical-json.md
      - ADR-0009 - Atomic world session: adr/0009-authoritative-session-and-atomic-staging.md
      - ADR-0010 - Snapshots and random state: adr/0010-canonical-snapshots-hashes-and-random-streams.md
      - ADR-0011 - Replay and branches: adr/0011-replay-checkpoints-and-immutable-branches.md
      - ADR-0012 - CLI composition and paths: adr/0012-data-only-cli-composition-and-path-confinement.md
      - ADR template: adr/template.md
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables
