      - ADR-0033 - Installed WorldStore conformance: adr/0033-explicit-installed-world-store-conformance.md
      - ADR template: adr/template.md
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables
