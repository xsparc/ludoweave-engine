  - WorldStore conformance: world-store-conformance.md
  - Plugin manifests and compatibility: plugins.md
  - Rollback and network-snapshot readiness: rollback-readiness.md
  - Constrained 3D scope decision: constrained-3d-decision.md
  - Visual-editor admission decision: visual-editor-decision.md
  - WASM-mod security decision: wasm-mod-security-decision.md
  - First contribution: first-contribution.md
  - Release process: release-process.md
  - Alpha release notes: releases/0.1.0a1.md
  - Alpha retrospective: alpha-retrospective.md
  - Performance and native-code decision:
      - RFC index: rfcs/index.md
      - RFC-0001 - Defer first native kernel: rfcs/0001-defer-first-native-kernel.md
      - RFC-0002 - Data-only plugin manifests: rfcs/0002-data-only-plugin-manifest-compatibility.md
  - Issue triage: triage.md
  - Runtime contract: runtime-contract.md
  - ECS and world storage: ecs.md
  - Fixed-step application: fixed-step-application.md
  - Persistent commands: commands.md
  - 2D rendering: rendering.md
  - M4 gameplay vertical slice: gameplay.md
  - Agent control interface: agent-control.md
  - Live semantic inspector: inspector.md
  - Rich 2D presentation authoring: presentation.md
  - API status and compatibility: api-status.md
  - Headless command workflow: cli-workflows.md
  - Benchmarks: benchmarks.md
