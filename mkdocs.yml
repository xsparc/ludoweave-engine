site_name: LudoWeave Engine
site_description: Deterministic, headless-first Python engine for agent-operable 2D worlds
repo_name: ludoweave-engine
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Home: index.md
  - Community-alpha user guide: user-guide.md
  - Architecture: architecture.md
  - Adapter and extension guide: adapter-guide.md
  - First contribution: first-contribution.md
  - Release process: release-process.md
  - Alpha release notes: releases/0.1.0a1.md
  - Alpha retrospective: alpha-retrospective.md
  - Issue triage: triage.md
  - Runtime contract: runtime-contract.md
  - ECS and world storage: ecs.md
  - Fixed-step application: fixed-step-application.md
  - Persistent commands: commands.md
  - 2D rendering: rendering.md
  - M4 gameplay vertical slice: gameplay.md
  - Agent control interface: agent-control.md
  - API status and compatibility: api-status.md
  - Headless command workflow: cli-workflows.md
  - Benchmarks: benchmarks.md
  - Decisions:
      - ADR index: adr/index.md
      - ADR-0001 — Product scope: adr/0001-deterministic-headless-agent-operable-2d.md
      - ADR-0002 — Dependency direction: adr/0002-dependency-direction-and-backend-isolation.md
      - ADR-0003 — Component identity: adr/0003-component-identity-and-migrations.md
      - ADR-0004 — World storage: adr/0004-canonical-world-storage-and-epochs.md
      - ADR-0005 — Queries and local commands: adr/0005-query-cursors-and-local-command-buffers.md
      - ADR-0006 — Resources and scheduling: adr/0006-explicit-resources-and-conflict-aware-serial-scheduling.md
      - ADR-0007 — Fixed-step application: adr/0007-fixed-step-application-input-and-system-context.md
      - ADR-0008 - Command protocol: adr/0008-versioned-command-envelope-and-canonical-json.md
      - ADR-0009 - Atomic world session: adr/0009-authoritative-session-and-atomic-staging.md
      - ADR-0010 - Snapshots and random state: adr/0010-canonical-snapshots-hashes-and-random-streams.md
      - ADR-0011 - Replay and branches: adr/0011-replay-checkpoints-and-immutable-branches.md
      - ADR-0012 - CLI composition and paths: adr/0012-data-only-cli-composition-and-path-confinement.md
      - ADR-0013 - Presentation ownership: adr/0013-presentation-extraction-and-render-resource-ownership.md
      - ADR-0014 - Render graph: adr/0014-explicit-render-graph-dependencies-and-lifetimes.md
      - ADR-0015 - Optional wgpu adapter: adr/0015-single-optional-wgpu-adapter-and-exact-pins.md
      - ADR-0016 - Platform input: adr/0016-provider-neutral-platform-events-and-action-snapshots.md
      - ADR-0017 - Content-addressed assets: adr/0017-content-addressed-project-confined-assets.md
      - ADR-0018 - Collision and audio: adr/0018-bounded-deterministic-collision-and-minimal-audio.md
      - ADR-0019 - Agent service and safe points: adr/0019-agent-service-capabilities-and-safe-points.md
      - ADR-0020 - Local stdio MCP: adr/0020-local-stdio-mcp-adapter.md
      - ADR-0021 - API stability metadata: adr/0021-explicit-public-api-stability-metadata.md
      - ADR template: adr/template.md
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables
