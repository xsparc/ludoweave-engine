name: Bug report
description: Report reproducible incorrect behavior in LudoWeave Engine
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; follow SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest code, commands, and inputs that reproduce the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LudoWeave version or revision
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, CPython version, and relevant dependency versions. Remove secrets and personal paths.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Executed evidence
      description: Exact commands and results, including tracebacks with secrets removed.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing issue.
          required: true
        - label: This is not a security vulnerability.
          required: true
