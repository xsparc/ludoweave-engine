name: Alpha release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_NO_PROGRESS: "1"
  UV_VERSION: "0.11.29"

jobs:
  release:
    name: Validate, attest, and publish prerelease
    if: github.repository == 'xsparc/ludoweave-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv and baseline CPython
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Read and verify release version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify signed release tag and main ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          tag_object_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{tag}")"
          git show "origin/main:scripts/verify_release_ref.py" > "$RUNNER_TEMP/verify_release_ref.py"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-ref.json"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" > "$RUNNER_TEMP/release-tag.json"
          python "$RUNNER_TEMP/verify_release_ref.py" \
            . "$RUNNER_TEMP/release-ref.json" "$RUNNER_TEMP/release-tag.json" \
            --expected-tag "$RELEASE_TAG" --expected-commit "$RELEASE_COMMIT"
      - name: Install Linux software-rendering runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libvulkan1 mesa-vulkan-drivers
      - name: Install locked environment
        run: uv sync --frozen --all-groups --extra graphics
      - name: Verify lockfile
        run: uv lock --check
      - name: Check formatting
        run: uv run --frozen ruff format --check .
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Type check
        run: uv run --frozen pyright
      - name: Run tests
        run: uv run --frozen --extra graphics pytest -q
      - name: Build documentation
        run: uv run --frozen mkdocs build --strict
      - name: Build source and wheel distributions
        run: |
          uv build --out-dir .tmp/release-dist-first
          uv build --out-dir .tmp/release-dist-second
          uv run --frozen python scripts/verify_distribution_reproducibility.py .tmp/release-dist-first .tmp/release-dist-second
      - name: Smoke-test installed wheel
        run: uv run --frozen python scripts/smoke_wheel.py .tmp/release-dist-first
      - name: Stage release inputs
        run: uv run --frozen python scripts/release_artifacts.py .tmp/release-dist-first release --tag "${{ github.ref_name }}"
      - name: Smoke-test staged release
        run: uv run --frozen python scripts/smoke_release.py release
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-path: release/*
      - name: Attest wheel SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-path: release/ludoweave-${{ steps.version.outputs.version }}-py3-none-any.whl
          sbom-path: release/ludoweave-${{ steps.version.outputs.version }}.spdx.json
      - name: Preserve release candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ludoweave-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - name: Create draft GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --draft
          --prerelease
          --latest=false
          --title "LudoWeave ${{ steps.version.outputs.version }}"
          --notes-file release/RELEASE_NOTES.md
      - name: Upload draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY"
      - name: Verify draft release asset integrity
        id: verify_draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: LudoWeave ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          release_id="$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId
          )"
          case "$release_id" in
            ""|*[!0-9]*) echo "invalid draft release id" >&2; exit 1 ;;
          esac
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            > "$RUNNER_TEMP/release-draft.json"
          uv run --frozen python scripts/verify_release_draft.py \
            release "$RUNNER_TEMP/release-draft.json" \
            --expected-tag "$GITHUB_REF_NAME" --expected-title "$RELEASE_TITLE" \
            --expected-state draft
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Publish verified GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --draft=false
          --prerelease
          --latest=false
      - name: Verify published GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.verify_draft.outputs.release_id }}
          RELEASE_TITLE: LudoWeave ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          case "$RELEASE_ID" in
            ""|*[!0-9]*) echo "invalid published release id" >&2; exit 1 ;;
          esac
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            > "$RUNNER_TEMP/release-published.json"
          uv run --frozen python scripts/verify_release_draft.py \
            release "$RUNNER_TEMP/release-published.json" \
            --expected-tag "$GITHUB_REF_NAME" --expected-title "$RELEASE_TITLE" \
            --expected-state published \
            --asset-plan "$RUNNER_TEMP/release-assets.plan"
      - name: Retrieve and verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: LudoWeave ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          plan="$RUNNER_TEMP/release-assets.plan"
          download_dir="$RUNNER_TEMP/release-download"
          mkdir "$download_dir"
          exec 3< "$plan"
          IFS= read -r protocol <&3
          test "$protocol" = "ludoweave.release-asset-retrieval-plan/1"
          asset_count=0
          expected_total=0
          while IFS=$'\t' read -r asset_id expected_bytes asset_name <&3; do
            if [[ ! "$asset_id" =~ ^[1-9][0-9]{0,18}$ ]]; then
              echo "invalid release asset id" >&2
              exit 1
            fi
            if [[ ${#asset_id} -eq 19 && "$asset_id" > "9223372036854775807" ]]; then
              echo "invalid release asset id" >&2
              exit 1
            fi
            if [[ ! "$expected_bytes" =~ ^(0|[1-9][0-9]{0,8})$ ]]; then
              echo "invalid release asset size" >&2
              exit 1
            fi
            if [[ ${#expected_bytes} -eq 9 && "$expected_bytes" > "268435456" ]]; then
              echo "invalid release asset size" >&2
              exit 1
            fi
            if [[ ! "$asset_name" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]{0,255}$ ]]; then
              echo "invalid release asset name" >&2
              exit 1
            fi
            test "$asset_count" -lt 32
            expected_total=$((expected_total + expected_bytes))
            test "$expected_total" -le 536870912
            target="$download_dir/$asset_name"
            partial="$download_dir/.asset-$asset_id.part"
            test ! -e "$target"
            test ! -e "$partial"
            gh api \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              | head -c "$((expected_bytes + 1))" > "$partial"
            test "$(wc -c < "$partial")" -eq "$expected_bytes"
            mv "$partial" "$target"
            asset_count=$((asset_count + 1))
          done
          exec 3<&-
          test "$asset_count" -gt 0
          uv run --frozen python scripts/verify_release_draft.py \
            "$download_dir" "$RUNNER_TEMP/release-published.json" \
            --expected-tag "$GITHUB_REF_NAME" --expected-title "$RELEASE_TITLE" \
            --expected-state published
      - name: Verify published release attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          uv run --frozen python scripts/verify_release_attestations.py \
            "$RUNNER_TEMP/release-download" \
            "$RUNNER_TEMP/release-assets.plan" \
            --expected-tag "$GITHUB_REF_NAME" \
            --expected-commit "$GITHUB_SHA"
      - name: Verify public release consumer path
        env:
          RELEASE_ID: ${{ steps.verify_draft.outputs.release_id }}
          RELEASE_TITLE: LudoWeave ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_ID" =~ ^[1-9][0-9]{0,18}$ ]]; then
            echo "invalid public release id" >&2
            exit 1
          fi
          if [[ ${#RELEASE_ID} -eq 19 && "$RELEASE_ID" > "9223372036854775807" ]]; then
            echo "invalid public release id" >&2
            exit 1
          fi
          plan="$RUNNER_TEMP/release-assets.plan"
          public_document="$RUNNER_TEMP/release-public.json"
          public_dir="$RUNNER_TEMP/release-public-download"
          test ! -e "$public_document"
          test ! -e "$public_dir"
          mkdir "$public_dir"
          curl --disable --fail --silent --show-error --location --max-redirs 3 \
            --connect-timeout 10 --max-time 30 \
            --proto '=https' --proto-redir '=https' \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            | head -c 4194305 > "$public_document"
          test "$(wc -c < "$public_document")" -le 4194304
          uv run --frozen python scripts/verify_release_draft.py \
            release "$public_document" \
            --expected-tag "$GITHUB_REF_NAME" --expected-title "$RELEASE_TITLE" \
            --expected-state published
          exec 3< "$plan"
          IFS= read -r protocol <&3
          test "$protocol" = "ludoweave.release-asset-retrieval-plan/1"
          asset_count=0
          expected_total=0
          while IFS=$'\t' read -r asset_id expected_bytes asset_name <&3; do
            if [[ ! "$asset_id" =~ ^[1-9][0-9]{0,18}$ ]]; then
              echo "invalid release asset id" >&2
              exit 1
            fi
            if [[ ${#asset_id} -eq 19 && "$asset_id" > "9223372036854775807" ]]; then
              echo "invalid release asset id" >&2
              exit 1
            fi
            if [[ ! "$expected_bytes" =~ ^(0|[1-9][0-9]{0,8})$ ]]; then
              echo "invalid release asset size" >&2
              exit 1
            fi
            if [[ ${#expected_bytes} -eq 9 && "$expected_bytes" > "268435456" ]]; then
              echo "invalid release asset size" >&2
              exit 1
            fi
            if [[ ! "$asset_name" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]{0,255}$ ]]; then
              echo "invalid release asset name" >&2
              exit 1
            fi
            test "$asset_count" -lt 32
            expected_total=$((expected_total + expected_bytes))
            test "$expected_total" -le 536870912
            target="$public_dir/$asset_name"
            partial="$public_dir/.asset-$asset_id.part"
            test ! -e "$target"
            test ! -e "$partial"
            curl --disable --fail --silent --show-error --location --max-redirs 3 \
              --connect-timeout 10 --max-time 30 \
              --proto '=https' --proto-redir '=https' \
              --header "Accept: application/octet-stream" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              | head -c "$((expected_bytes + 1))" > "$partial"
            test "$(wc -c < "$partial")" -eq "$expected_bytes"
            mv "$partial" "$target"
            asset_count=$((asset_count + 1))
          done
          exec 3<&-
          test "$asset_count" -gt 0
          uv run --frozen python scripts/verify_release_draft.py \
            "$public_dir" "$public_document" \
            --expected-tag "$GITHUB_REF_NAME" --expected-title "$RELEASE_TITLE" \
            --expected-state published
          uv run --frozen python scripts/smoke_release.py "$public_dir"
