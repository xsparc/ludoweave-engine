name: Alpha release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_NO_PROGRESS: "1"
  UV_VERSION: "0.11.29"

jobs:
  release:
    name: Validate, attest, and publish prerelease
    if: github.repository == 'xsparc/ludoweave-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install uv and baseline CPython
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Linux software-rendering runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libvulkan1 mesa-vulkan-drivers
      - name: Install locked environment
        run: uv sync --frozen --all-groups --extra graphics
      - name: Verify lockfile
        run: uv lock --check
      - name: Check formatting
        run: uv run --frozen ruff format --check .
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Type check
        run: uv run --frozen pyright
      - name: Run tests
        run: uv run --frozen --extra graphics pytest -q
      - name: Build documentation
        run: uv run --frozen mkdocs build --strict
      - name: Read and verify release version
        id: version
        shell: bash
        run: |
          version="$(uv run --frozen python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build source and wheel distributions
        run: uv build
      - name: Smoke-test installed wheel
        run: uv run --frozen python scripts/smoke_wheel.py dist
      - name: Stage release inputs
        run: uv run --frozen python scripts/release_artifacts.py dist release --tag "${{ github.ref_name }}"
      - name: Smoke-test staged release
        run: uv run --frozen python scripts/smoke_release.py release
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-path: release/*
      - name: Attest wheel SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-path: release/ludoweave-${{ steps.version.outputs.version }}-py3-none-any.whl
          sbom-path: release/ludoweave-${{ steps.version.outputs.version }}.spdx.json
      - name: Preserve release candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ludoweave-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --prerelease
          --latest=false
          --title "LudoWeave ${{ steps.version.outputs.version }}"
          --notes-file release/RELEASE_NOTES.md
