[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "ludoweave"
version = "0.1.0.dev0"
description = "Deterministic, headless-first Python engine for agent-operable 2D worlds"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "LudoWeave Engine contributors" }]
keywords = [
  "2d",
  "deterministic-simulation",
  "game-engine",
  "headless",
  "python",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Games/Entertainment",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
graphics = [
  "glfw==2.10.2",
  "rendercanvas[glfw]==2.7.2",
  "wgpu==0.32.0",
]

[project.scripts]
ludoweave = "ludoweave.tools.cli:main"

[dependency-groups]
dev = [
  "hypothesis==6.160.0",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "ruff==0.15.22",
]
docs = [
  "mkdocs-material==9.7.7",
]

[tool.uv]
required-version = ">=0.11.16,<0.12"
default-groups = ["dev", "docs"]

[tool.hatch.build.targets.wheel]
packages = ["src/ludoweave"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist", "site"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ludoweave"]

[tool.pyright]
include = ["src", "tests", "examples", "scripts", "benchmarks"]
exclude = [".venv", "build", "dist", "site"]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--basetemp=.pytest-tmp"]
testpaths = ["tests"]
